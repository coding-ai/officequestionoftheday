<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Question of the Day</title>
<meta name="description" content="One question a day. Answer it, then find out how far you sit from everyone else.">
<link rel="canonical" href="https://officequestionoftheday.com/">
<meta property="og:title" content="Office Question of the Day">
<meta property="og:description" content="One question a day. Find out how far you sit from everyone else.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://officequestionoftheday.com/">
<meta property="og:image" content="https://officequestionoftheday.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0D18">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OQOTD">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0D18; --fg:#EEF0F7; --dim:#7C8398; --dimmer:#474D63;
  --line:rgba(238,240,247,.10); --line-bright:rgba(238,240,247,.24);
  --a:#FF6B4A; --a-soft:rgba(255,107,74,.16); --a-edge:rgba(255,107,74,.55);
  --b:#3DD9C4; --b-soft:rgba(61,217,196,.16); --b-edge:rgba(61,217,196,.55);
  --violet:#8B7BF7;
  --display:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--fg);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
  position:relative;overflow-x:hidden;
}
body::before,body::after{
  content:'';position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(90px);
}
body::before{width:min(62vw,460px);aspect-ratio:1;top:-14%;left:-14%;
  background:radial-gradient(circle,rgba(139,123,247,.30),transparent 68%)}
body::after{width:min(54vw,400px);aspect-ratio:1;bottom:-16%;right:-16%;
  background:radial-gradient(circle,rgba(61,217,196,.18),transparent 68%)}

.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  max-width:680px;margin:0 auto;padding:0 clamp(18px,5vw,28px)}

.head{flex:none;display:flex;justify-content:space-between;align-items:center;height:54px;
  padding-top:env(safe-area-inset-top);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.head .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a);
  margin-right:9px;vertical-align:middle;box-shadow:0 0 10px var(--a);
  animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.ask{flex:none;padding:clamp(32px,7vh,58px) 0 clamp(24px,4.5vh,36px)}
.meta{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dimmer);margin:0 0 16px}
.q{font-family:var(--display);font-weight:600;font-size:clamp(28px,6.8vw,46px);
  line-height:1.1;letter-spacing:-.025em;margin:0;max-width:17ch;text-wrap:balance}
.q.loading{color:rgba(238,240,247,.1)}
.offline{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer);padding:12px 0 0}

.rows{flex:none;display:flex;flex-direction:column;gap:11px}
.row{position:relative;overflow:hidden;width:100%;border:1px solid var(--line);border-radius:12px;
  background:rgba(238,240,247,.025);color:var(--fg);display:flex;align-items:center;
  justify-content:space-between;gap:14px;
  padding:clamp(17px,3.3vh,23px) clamp(16px,3.6vw,22px);
  padding-left:calc(clamp(16px,3.6vw,22px) + 6px);
  font-family:var(--display);font-weight:500;font-size:clamp(16px,4.1vw,21px);
  letter-spacing:-.015em;text-align:left;cursor:pointer;
  transition:border-color .2s ease,transform .12s ease}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2;background:var(--a)}
#rowB::before{background:var(--b)}
.row:active{transform:scale(.994)}
@media (hover:hover){
  #rowA:not(.locked):hover{border-color:var(--a-edge)}
  #rowB:not(.locked):hover{border-color:var(--b-edge)}
}
.row:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.row.locked{cursor:default}
.bar{position:absolute;inset:0;width:0;z-index:0;background:var(--a-soft);transition:width 1.05s var(--ease)}
#rowB .bar{background:var(--b-soft)}
.row > span:not(.bar){position:relative;z-index:1}
.row.mine{box-shadow:inset 0 0 0 1px var(--a-edge)}
#rowB.mine{box-shadow:inset 0 0 0 1px var(--b-edge)}
.val{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--a);
  opacity:0;transition:opacity .4s ease .35s;white-space:nowrap}
#rowB .val{color:var(--b)}
.revealed .val{opacity:1}

.verdict{flex:none;padding:24px 0 0;opacity:0;transform:translateY(6px);
  transition:opacity .5s ease .72s,transform .5s var(--ease) .72s}
.revealed .verdict{opacity:1;transform:none}
.verdict p{font-family:var(--display);font-weight:500;font-size:clamp(17px,4.3vw,22px);
  letter-spacing:-.02em;margin:0 0 8px}
.verdict p.minority{color:var(--a)}
.verdict p.majority{color:var(--b)}
.verdict .sub{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dimmer);margin:0}

.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.btn{border:1px solid var(--line);background:rgba(238,240,247,.03);color:var(--fg);
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:12px 18px;border-radius:999px;cursor:pointer;
  transition:border-color .2s ease,background .2s ease,color .2s ease}
.btn:hover{border-color:var(--violet);background:rgba(139,123,247,.1)}
.btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--fg)}

.spacer{flex:1;min-height:28px}

.room{border:1px solid var(--line);border-radius:14px;background:rgba(238,240,247,.022);
  padding:16px 18px;margin-bottom:12px}
.room .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);
  margin:0 0 11px;display:flex;justify-content:space-between;gap:10px}
.room .k b{font-weight:400;color:var(--violet);letter-spacing:.28em}
.cmp{display:flex;flex-direction:column;gap:9px}
.cmp .line{display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:11px}
.cmp .tag{width:50px;flex:none;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase}
.cmp .track{flex:1;height:7px;border-radius:4px;background:rgba(238,240,247,.07);overflow:hidden}
.cmp .fill{height:100%;width:0;background:var(--a);border-radius:4px;transition:width .9s var(--ease)}
.cmp .num{width:40px;flex:none;text-align:right;color:var(--fg);font-weight:500}
.room .note{margin:12px 0 0;font-size:10.5px;letter-spacing:.06em;color:var(--dimmer);line-height:1.6}
.room .note b{color:var(--violet);font-weight:400;letter-spacing:.2em}
.room .join{display:flex;gap:8px}
.room input{flex:1;min-width:0;background:rgba(238,240,247,.04);border:1px solid var(--line);
  border-radius:9px;color:var(--fg);font-family:var(--mono);font-size:15px;
  letter-spacing:.32em;text-transform:uppercase;padding:11px 13px}
.room input:focus{outline:none;border-color:var(--violet)}
.room input::placeholder{letter-spacing:.2em;color:var(--dimmer)}
.room .sm{padding:11px 15px;font-size:9.5px}
.linkish{background:none;border:0;padding:0;color:var(--violet);cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-decoration:underline}

.nudge{border:1px solid rgba(139,123,247,.32);border-radius:14px;
  background:rgba(139,123,247,.07);padding:15px 17px;margin-bottom:12px;display:none}
.nudge.show{display:block}
.nudge p{margin:0 0 12px;font-size:11.5px;letter-spacing:.04em;color:var(--fg);line-height:1.6}
.nudge .row2{display:flex;gap:8px;flex-wrap:wrap}
.nudge .no{border-color:transparent;color:var(--dimmer)}

.panel{flex:none;border:1px solid var(--line);border-radius:14px;background:rgba(238,240,247,.022);
  padding:16px 18px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;
  gap:12px 18px;align-items:end}
.stat .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);margin:0 0 7px}
.stat .v{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.01em;
  margin:0;color:var(--violet)}
.stat .v em{font-style:normal;color:var(--dimmer);font-size:11px;letter-spacing:.08em}
.stat.right{text-align:right}
.stat.right .v{color:var(--fg)}
.gauge{grid-column:1/-1;display:flex;gap:3px;height:4px;margin-top:4px}
.gauge i{flex:1;background:rgba(238,240,247,.09);border-radius:2px}
.gauge i.on{background:var(--a);box-shadow:0 0 7px rgba(255,107,74,.5)}
.gauge i.off{background:rgba(61,217,196,.35)}

.arch{border-top:1px solid var(--line);padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.arch summary{list-style:none;cursor:pointer;height:46px;display:flex;align-items:center;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer)}
.arch summary::-webkit-details-marker{display:none}
.arch summary:hover{color:var(--dim)}
.arch ul{list-style:none;margin:0;padding:0 0 8px}
.arch li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:12px 0;
  border-top:1px solid var(--line);font-family:var(--display);font-size:14.5px;color:var(--dim)}
.arch li .s{font-family:var(--mono);font-size:11px;color:var(--dimmer);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(6px);
  background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;padding:11px 17px;border-radius:999px;
  opacity:0;pointer-events:none;z-index:30;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="head">
    <span><span class="dot"></span>Office Question of the Day</span>
    <span id="date"></span>
  </header>

  <div class="ask">
    <p class="meta" id="meta">Loading</p>
    <h1 class="q loading" id="q">&nbsp;</h1>
    <p class="offline" id="offline" hidden>Offline — your vote won't be counted</p>
  </div>

  <div class="rows">
    <button class="row" id="rowA" type="button">
      <span class="bar" id="barA"></span>
      <span id="labelA">&nbsp;</span>
      <span class="val" id="valA"></span>
    </button>
    <button class="row" id="rowB" type="button">
      <span class="bar" id="barB"></span>
      <span id="labelB">&nbsp;</span>
      <span class="val" id="valB"></span>
    </button>
  </div>

  <div class="verdict" id="verdict">
    <p id="vLine"></p>
    <p class="sub" id="vSub"></p>
    <div class="acts">
      <button class="btn" id="share" type="button">Share result</button>
      <button class="btn ghost" id="board" type="button">Copy for your board</button>
      <button class="btn ghost" id="install" type="button" hidden>Add to home screen</button>
    </div>
  </div>

  <div class="spacer"></div>

  <section class="nudge" id="nudge">
    <p id="nudgeText">Want tomorrow’s question? One notification a day, at 9am your time.</p>
    <div class="row2">
      <button class="btn" id="nudgeYes" type="button">Notify me</button>
      <button class="btn ghost no" id="nudgeNo" type="button">No thanks</button>
    </div>
  </section>

  <section class="room">
    <p class="k"><span>Your office</span><b id="roomCode"></b></p>
    <div id="roomBody"></div>
  </section>

  <section class="panel">
    <div class="stat">
      <p class="k">Contrarian index</p>
      <p class="v" id="idx">— <em>answer to begin</em></p>
    </div>
    <div class="stat right">
      <p class="k">Next question</p>
      <p class="v" id="clock">--:--:--</p>
    </div>
    <div class="gauge" id="gauge"></div>
  </section>

  <details class="arch">
    <summary>Previous questions</summary>
    <ul id="past"></ul>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   CONFIG
   =================================================================== */
const API_BASE = 'https://oqotd-api.YOUR-SUBDOMAIN.workers.dev';
const SITE = 'officequestionoftheday.com';

const FALLBACK = [
  ['What goes on first?', 'Socks', 'Trousers'],
  ['Do you sit or stand to put your socks on?', 'Sit down', 'Stand up'],
  ['Toilet roll hangs:', 'Over the front', 'Under the back'],
  ['Is a hot dog a sandwich?', 'Yes', 'No'],
  ['Phone on the table:', 'Face down', 'Face up'],
  ['Do you cut a sandwich diagonally or straight?', 'Diagonally', 'Straight across'],
  ['Is "quick call?" with no context a threat?', 'It\u2019s a threat', 'Perfectly normal'],
];

const $ = id => document.getElementById(id);
const LS = { client:'oqotd_client', voted:'oqotd_voted', hist:'oqotd_hist', room:'oqotd_room' };
let S = { qid:null, date:null, text:'', a:'', b:'', tally:[0,0], choice:null, live:false, room:null };

const dayNum = () => Math.floor(Date.now() / 86400000);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function clientId(){
  let v = localStorage.getItem(LS.client);
  if (!v){
    v = crypto.randomUUID ? crypto.randomUUID()
      : Date.now().toString(16) + Math.random().toString(16).slice(2);
    localStorage.setItem(LS.client, v);
  }
  return v;
}
const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const voted = () => read(LS.voted) || {};
const history = () => read(LS.hist) || { entries: [] };
const myRoom = () => localStorage.getItem(LS.room) || null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================================================================
   CONTRARIAN INDEX — the reason to come back
   =================================================================== */
function recordOutcome(qid, choice, tally){
  const h = history();
  const total = tally[0] + tally[1];
  const mine = choice === 0 ? tally[0] : tally[1];
  const resolved = total >= 10;
  const entry = { qid, day:dayNum(), resolved, minority: resolved ? (mine/total < .5) : null };
  const i = h.entries.findIndex(e => e.qid === qid);
  if (i >= 0) h.entries[i] = entry; else h.entries.push(entry);
  h.entries = h.entries.slice(-60);
  localStorage.setItem(LS.hist, JSON.stringify(h));
}

function paintPanel(){
  const h = history();
  const resolved = h.entries.filter(e => e.resolved);
  const minority = resolved.filter(e => e.minority).length;
  $('idx').innerHTML = resolved.length === 0
    ? '\u2014 <em>answer to begin</em>'
    : Math.round(minority / resolved.length * 100) + '% <em>' + minority + ' of ' + resolved.length + '</em>';

  const shown = h.entries.slice(-22);
  $('gauge').innerHTML = shown.length
    ? shown.map(e => '<i class="' + (e.resolved ? (e.minority ? 'on' : 'off') : '') + '"></i>').join('')
    : Array.from({length:22}, () => '<i></i>').join('');
}

function tick(){
  const now = new Date();
  const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const s = Math.max(0, Math.floor((next - now.getTime()) / 1000));
  const p = n => String(n).padStart(2,'0');
  $('clock').textContent = p(Math.floor(s/3600)) + ':' + p(Math.floor(s%3600/60)) + ':' + p(s%60);
}
setInterval(tick, 1000); tick();
$('date').textContent = new Date().toLocaleDateString(undefined,{day:'2-digit',month:'short'}).toUpperCase();

/* ===================================================================
   OFFICE ROOMS — your office against the world
   =================================================================== */
function paintRoom(){
  const code = myRoom();
  const body = $('roomBody');
  $('roomCode').textContent = code || '';

  if (!code){
    body.innerHTML =
      '<div class="join">' +
        '<input id="roomInput" maxlength="4" placeholder="CODE" autocomplete="off" ' +
               'autocapitalize="characters" spellcheck="false">' +
        '<button class="btn sm" id="roomJoin" type="button">Join</button>' +
      '</div>' +
      '<p class="note">See how your office compares with everyone else. ' +
        '<button class="linkish" id="roomNew" type="button">Create a room</button> ' +
        'and share the code with your team.</p>';
    $('roomJoin').addEventListener('click', joinRoom);
    $('roomNew').addEventListener('click', createRoom);
    $('roomInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
    return;
  }

  const rt = S.room ? S.room.tally : [0,0];
  const rTotal = rt[0] + rt[1];
  const gTotal = S.tally[0] + S.tally[1];

  if (S.choice === null){
    body.innerHTML = '<p class="note">Answer today\u2019s question to see how your office compares. ' +
      'Share code <b>' + code + '</b> with your team.</p>';
    return;
  }
  if (rTotal < 2){
    body.innerHTML = '<p class="note">' +
      (rTotal === 1 ? 'Just you so far.' : 'No votes yet.') +
      ' Send code <b>' + code + '</b> to your colleagues \u2014 the comparison gets ' +
      'interesting at about five people.</p>';
    return;
  }

  const rPct = Math.round(rt[0] / rTotal * 100);
  const gPct = gTotal ? Math.round(S.tally[0] / gTotal * 100) : 50;
  const gap = Math.abs(rPct - gPct);

  body.innerHTML =
    '<div class="cmp">' +
      '<div class="line"><span class="tag">Office</span>' +
        '<span class="track"><span class="fill" style="width:' + rPct + '%"></span></span>' +
        '<span class="num">' + rPct + '%</span></div>' +
      '<div class="line"><span class="tag">World</span>' +
        '<span class="track"><span class="fill" style="width:' + gPct + '%;background:var(--dimmer)"></span></span>' +
        '<span class="num" style="color:var(--dim)">' + gPct + '%</span></div>' +
    '</div>' +
    '<p class="note">' + rTotal + ' in your office, ' + rPct + '% for ' + esc(S.a) +
      (gap >= 15 ? ' \u2014 ' + gap + ' points off the rest of the world.' : '.') + '</p>';
}

async function joinRoom(){
  const code = ($('roomInput').value || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{4}$/.test(code)){ toast('Four characters, no O or I'); return; }
  try {
    const res = await fetch(API_BASE + '/api/room/' + code);
    if (!res.ok){ toast('No room with that code'); return; }
    localStorage.setItem(LS.room, code);
    location.reload();
  } catch { toast('Could not reach the server'); }
}

async function createRoom(){
  try {
    const res = await fetch(API_BASE + '/api/room', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}',
    });
    const d = await res.json();
    if (!d.code){ toast('Could not create a room'); return; }
    localStorage.setItem(LS.room, d.code);
    try {
      await navigator.clipboard.writeText(
        'Join my office on Office Question of the Day \u2014 code ' + d.code + '\n' + SITE);
      toast('Room ' + d.code + ' \u2014 code copied');
    } catch { toast('Room ' + d.code); }
    setTimeout(() => location.reload(), 900);
  } catch { toast('Could not reach the server'); }
}

/* ===================================================================
   RENDER
   =================================================================== */
function paintQuestion(){
  $('q').textContent = S.text;
  $('q').classList.remove('loading');
  $('labelA').textContent = S.a;
  $('labelB').textContent = S.b;
  $('meta').textContent = 'Today \u00b7 one question, two answers';
  $('offline').hidden = S.live;
}

function countUp(el, target){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = target + '%'; return; }
  const t0 = performance.now(), dur = 1000;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1-p, 3))) + '%';
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function reveal(){
  const a = S.tally[0], b = S.tally[1], total = a + b, thin = total < 10;
  const pa = total ? a / total : .5;

  $('barA').style.width = (pa*100).toFixed(1) + '%';
  $('barB').style.width = ((1-pa)*100).toFixed(1) + '%';
  $('rowA').classList.add('locked'); $('rowB').classList.add('locked');
  $('rowA').classList.toggle('mine', S.choice === 0);
  $('rowB').classList.toggle('mine', S.choice === 1);

  if (thin){
    $('valA').textContent = a + (a === 1 ? ' vote' : ' votes');
    $('valB').textContent = b + (b === 1 ? ' vote' : ' votes');
    $('vLine').className = '';
    $('vLine').textContent = total === 1 ? 'You\u2019re the first vote today.' : 'Too few votes to call.';
    $('vSub').textContent = total === 1 ? 'Send it to your office' : total + ' so far \u00b7 check back later';
  } else {
    countUp($('valA'), Math.round(pa*100));
    countUp($('valB'), 100 - Math.round(pa*100));
    const mine = S.choice === 0 ? a : b;
    const pct = Math.round(mine / total * 100);
    $('vLine').className = pct === 50 ? '' : pct < 50 ? 'minority' : 'majority';
    $('vLine').textContent = pct === 50 ? 'Dead even. Nobody wins this one.'
                          : pct < 50   ? 'You\u2019re in the minority.'
                                       : 'You\u2019re with the majority.';
    $('vSub').textContent = pct + '% agree \u00b7 ' + total.toLocaleString() + ' votes counted';
  }

  $('app').classList.add('revealed');
  paintPanel();
  paintRoom();
  setTimeout(maybeNudge, 1400);   // after the reveal has landed, not during
}

/* ===================================================================
   VOTING
   =================================================================== */
async function vote(choice){
  if (S.choice !== null) return;
  S.choice = choice;
  if (navigator.vibrate) navigator.vibrate(8);

  if (!S.live){ S.tally[choice]++; reveal(); return; }

  try {
    const res = await fetch(API_BASE + '/api/vote', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ qid:S.qid, choice, client_id:clientId(), room_code:myRoom() }),
    });
    if (res.status === 409){ location.reload(); return; }
    const d = await res.json();
    S.tally = d.tally;
    if (d.room) S.room = d.room;
  } catch { S.tally[choice]++; toast('Saved locally'); }

  const m = voted(); m[S.qid] = choice;
  localStorage.setItem(LS.voted, JSON.stringify(m).slice(0, 6000));
  recordOutcome(S.qid, choice, S.tally);
  reveal();
}
$('rowA').addEventListener('click', function(){ vote(0); });
$('rowB').addEventListener('click', function(){ vote(1); });

/* ===================================================================
   SHARING
   =================================================================== */
$('share').addEventListener('click', async () => {
  const total = S.tally[0] + S.tally[1];
  const mine = S.choice === 0 ? S.tally[0] : S.tally[1];
  const chosen = S.choice === 0 ? S.a : S.b;
  const h = history().entries.filter(e => e.resolved);
  const idx = h.length ? Math.round(h.filter(e => e.minority).length / h.length * 100) : null;

  let text = S.text + '\nI said: ' + chosen + '.';
  if (total >= 10) text += ' ' + Math.round(mine/total*100) + '% agree with me.';
  if (idx !== null && h.length >= 3) text += '\nContrarian index: ' + idx + '%.';

  // Share the shim URL: it carries per-question Open Graph tags, so the
  // preview shows today's question and its live split. The plain site can't —
  // it's static HTML and scrapers don't run JavaScript.
  const link = (S.live && S.date) ? API_BASE + '/s/' + S.date : 'https://' + SITE;

  if (navigator.share){
    try { await navigator.share({ title:'Office Question of the Day', text, url:link }); return; }
    catch (e) { /* dismissed */ }
  }
  try { await navigator.clipboard.writeText(text + '\n\n' + link); toast('Copied'); }
  catch { toast('Copy failed'); }
});

$('board').addEventListener('click', async () => {
  const code = myRoom();
  let t = S.text + '\n\nA) ' + S.a + '\nB) ' + S.b + '\n\n' + SITE;
  if (code) t += '\nOffice code: ' + code;
  try { await navigator.clipboard.writeText(t); toast('Copied \u2014 go write it up'); }
  catch { toast('Copy failed'); }
});

/* ===================================================================
   ADD TO HOME SCREEN
   =================================================================== */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e; $('install').hidden = false;
});
$('install').addEventListener('click', async () => {
  if (!deferredInstall){ toast('Share button, then Add to Home Screen'); return; }
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null; $('install').hidden = true;
});
// iOS fires no install event, so Safari users get the manual hint instead.
(function(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone) $('install').hidden = false;
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

/* ===================================================================
   NOTIFICATIONS

   The permission prompt is one-shot: a browser "block" is close to permanent
   and cannot be asked again. So we never call it on a first visit. It appears
   only after someone has answered on two separate days, and only after a
   reveal — the moment they have just had the payoff and know what they'd be
   subscribing to. A soft prompt first, so a "no thanks" costs us nothing.
   =================================================================== */
const PUSH = { asked:'oqotd_push_asked', on:'oqotd_push_on' };

function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

function maybeNudge(){
  if (!pushSupported()) return;
  if (localStorage.getItem(PUSH.asked) || localStorage.getItem(PUSH.on)) return;
  if (Notification.permission !== 'default') return;   // already granted or blocked

  // Two separate days of answering before we ask for anything.
  const days = new Set(history().entries.map(e => e.day));
  if (days.size < 2) return;

  // iOS only allows push from an installed PWA, so ask them to install first.
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone){
    $('nudgeText').textContent =
      'Want tomorrow\u2019s question? Add this to your home screen first \u2014 Share, then Add to Home Screen.';
    $('nudgeYes').textContent = 'Got it';
  }
  $('nudge').classList.add('show');
}

function urlB64ToUint8(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

async function enablePush(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone){
    localStorage.setItem(PUSH.asked, '1');
    $('nudge').classList.remove('show');
    toast('Add to home screen first');
    return;
  }

  try {
    const keyRes = await fetch(API_BASE + '/api/push/key');
    const { key } = await keyRes.json();
    if (!key){ toast('Notifications not available yet'); return; }

    const permission = await Notification.requestPermission();
    localStorage.setItem(PUSH.asked, '1');
    $('nudge').classList.remove('show');
    if (permission !== 'granted'){ toast('No notifications then'); return; }

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(key),
    });

    await fetch(API_BASE + '/api/push/subscribe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        endpoint: sub.endpoint,
        utc_offset_minutes: new Date().getTimezoneOffset(),
      }),
    });
    localStorage.setItem(PUSH.on, '1');
    toast('You\u2019ll get tomorrow\u2019s question at 9am');
  } catch {
    toast('Could not set up notifications');
  }
}

$('nudgeYes').addEventListener('click', enablePush);
$('nudgeNo').addEventListener('click', () => {
  localStorage.setItem(PUSH.asked, '1');
  $('nudge').classList.remove('show');
});

/* ===================================================================
   ARCHIVE
   =================================================================== */
let loaded = false;
document.querySelector('.arch').addEventListener('toggle', async e => {
  if (!e.target.open || loaded) return;
  loaded = true;
  const list = $('past');
  list.innerHTML = '<li>Loading\u2026</li>';
  try {
    const r = await fetch(API_BASE + '/api/archive?days=7');
    const data = await r.json();
    const qs = data.questions || [];
    list.innerHTML = qs.length ? qs.map(q => {
      const pa = q.total >= 10 ? Math.round(q.tally[0]/q.total*100) : null;
      return '<li><span>' + esc(q.text) + '</span><span class="s">' +
             (pa === null ? '\u2014' : pa + ' / ' + (100-pa)) + '</span></li>';
    }).join('') : '<li>Nothing here yet \u2014 this fills in daily.</li>';
  } catch { list.innerHTML = '<li>Archive unavailable.</li>'; }
});

/* ===================================================================
   BOOT
   =================================================================== */
(async function init(){
  paintPanel();
  paintRoom();

  try {
    const rc = myRoom();
    const res = await fetch(API_BASE + '/api/today' + (rc ? '?room=' + rc : ''));
    if (!res.ok) throw new Error('bad status');
    const d = await res.json();
    S = { qid:d.qid, date:d.date, text:d.text, a:d.option_a, b:d.option_b,
          tally:d.tally, choice:null, live:true, room:d.room || null };
  } catch {
    const i = dayNum() % FALLBACK.length;
    S = { qid:'off-'+i, date:null, text:FALLBACK[i][0], a:FALLBACK[i][1], b:FALLBACK[i][2],
          tally:[0,0], choice:null, live:false, room:null };
  }

  paintQuestion();
  paintRoom();

  const prior = voted()[S.qid];
  if (prior === 0 || prior === 1){
    S.choice = prior;
    if (S.live) recordOutcome(S.qid, prior, S.tally);
    reveal();
  }
})();
</script>

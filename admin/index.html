<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OQOTD — question review</title>
<style>
:root{--bg:#1A1C19;--panel:#232622;--line:#3A3E38;--text:#E6E8E3;--dim:#9AA093;
  --red:#E4576F;--green:#5FBF8B;--blue:#6FA8E8;
  --mono:ui-monospace,'DM Mono',Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;
  padding:32px 20px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin:0 0 26px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
input[type=password],input[type=text]{background:var(--panel);border:1px solid var(--line);
  color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 11px;border-radius:3px}
input[type=password]{flex:1 1 260px}
button{background:transparent;border:1px solid var(--line);color:var(--text);font-family:var(--mono);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.go{border-color:var(--blue);color:var(--blue)}
button.ok{border-color:var(--green);color:var(--green)}
button.no{border-color:var(--red);color:var(--red)}
.runway{color:var(--dim);font-size:12px;margin-bottom:18px}
.runway b{color:var(--text);font-weight:500}
.runway.low b{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px}
.card .q{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);
  color:var(--text);font-family:var(--mono);font-size:15px;padding:4px 0 8px;margin-bottom:12px}
.card .q:focus{outline:none;border-bottom-color:var(--blue)}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.opts input{flex:1 1 180px;font-size:13px}
.meta{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.meta .split{color:var(--text)}
.acts{display:flex;gap:8px}
.empty{color:var(--dim);padding:30px 0;text-align:center}
.msg{color:var(--dim);font-size:12px;margin-top:16px;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Question review</h1>
  <p class="sub">Generated drafts wait here. Edit the wording in place, then approve. Approved questions publish oldest-first, one per UTC day.</p>

  <div class="bar">
    <input type="password" id="token" placeholder="Admin token" autocomplete="off">
    <button class="go" id="load">Load queue</button>
    <button id="gen">Generate more</button>
  </div>

  <p class="runway" id="runway"></p>
  <div id="list"></div>
  <p class="msg" id="msg"></p>
</div>

<script>
/* Point at your Worker. Open this file locally — do not publish it. */
const API_BASE = 'https://api.officequestionoftheday.com';

const el = id => document.getElementById(id);
const tok = () => el('token').value.trim();
const say = m => el('msg').textContent = m;

async function call(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), ...(opts.headers || {}) },
  });
  if (res.status === 401) throw new Error('Token rejected.');
  if (!res.ok) throw new Error('Request failed (' + res.status + ').');
  return res.json();
}

async function load() {
  say('Loading…');
  try {
    const { drafts, runway_days } = await call('/admin/queue');
    const low = runway_days < 21;
    el('runway').className = 'runway' + (low ? ' low' : '');
    el('runway').innerHTML = `Runway: <b>${runway_days} days</b> of universal questions${low ? ' — worth topping up' : ''}`;
    render(drafts);
    say(drafts.length ? drafts.length + ' drafts awaiting review' : '');
  } catch (e) { say(e.message); }
}

function render(drafts) {
  const list = el('list');
  if (!drafts.length) { list.innerHTML = '<p class="empty">Nothing to review.</p>'; return; }
  list.innerHTML = '';
  drafts.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <input class="q" value="${esc(d.text)}">
      <div class="opts">
        <input type="text" class="oa" value="${esc(d.option_a)}">
        <input type="text" class="ob" value="${esc(d.option_b)}">
      </div>
      <p class="meta">${esc(d.genre)} · ${esc(d.category)} · predicted split <span class="split">${d.predicted_a} / ${100 - d.predicted_a}</span></p>
      <div class="acts">
        <button class="ok">Approve</button>
        <button class="no">Reject</button>
      </div>`;
    card.querySelector('.ok').addEventListener('click', () => review(d.id, 'approve', card));
    card.querySelector('.no').addEventListener('click', () => review(d.id, 'reject', card));
    list.appendChild(card);
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function review(id, action, card) {
  const body = { id, action };
  if (action === 'approve') {
    body.text = card.querySelector('.q').value;
    body.option_a = card.querySelector('.oa').value;
    body.option_b = card.querySelector('.ob').value;
  }
  try {
    await call('/admin/review', { method: 'POST', body: JSON.stringify(body) });
    card.remove();
    say(action === 'approve' ? 'Approved.' : 'Rejected.');
  } catch (e) { say(e.message); }
}

el('load').addEventListener('click', load);
el('gen').addEventListener('click', async () => {
  say('Generating — this takes a few seconds…');
  try {
    const r = await call('/admin/generate', { method: 'POST' });
    if (r.error) { say('Generation failed: ' + r.error); return; }
    say(`Added ${r.inserted} drafts. ${r.rejected.length} candidates failed the quality gate.`);
    load();
  } catch (e) { say(e.message); }
});
el('token').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
